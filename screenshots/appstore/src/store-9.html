<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .headline { top: 250px; left: 90px; right: 90px; text-align: center; }
  .h1 { font-size: 138px; }
  .subline { font-size: 48px; }

  .phone-wrap { width: 650px; top: 880px; left: 45px; transform: perspective(2400px) rotateY(11deg) rotate(-2deg); }
  .phone { width: 650px; }
  .phone .inner { height: 1340px; }
  .rim-glow { width: 770px; height: 1380px; top: 900px; left: 0px;
    background: radial-gradient(circle, rgba(124,92,255,0.7), rgba(255,61,166,0.4), transparent 70%); }

  .ganguly { width: 540px; bottom: 0; right: 40px; }
  .floor { width: 420px; bottom: 30px; right: 60px; }

  .stroke.a { width: 1500px; height: 150px; top: 720px; left: -160px; transform: rotate(-15deg); }
  .stroke.b { width: 1200px; height: 120px; top: 2270px; left: -180px; transform: rotate(-15deg); opacity:0.78; }
  .stroke.c { width: 900px; height: 110px; top: 680px; left: 540px; transform: rotate(-15deg); opacity:0.7; }

  .ball { width: 220px; height: 220px; top: 760px; left: 130px; transform: rotate(14deg); }
  .ball-trail { width: 350px; height: 350px; top: 700px; left: 70px; }

  .chip.c1 { top: 2280px; left: 70px; }
  .chip.pill.c2 { top: 2560px; left: 70px; }
</style></head>
<body><div class="stage">
  <div class="bg-base"></div><div class="mesh"></div>
  <div class="strokes">
    <div class="stroke s-violet a"></div>
    <div class="stroke s-orange b"></div>
    <div class="stroke s-cyan c"></div>
  </div>
  <div class="ball-trail"></div><div class="ball"></div>
  <div class="vignette"></div><div class="grain"></div>

  <div class="logo"><img src="assets/bcpl-logo-white.png"></div>

  <div class="headline">
    <div class="eyebrow">Ten Franchises</div>
    <div class="h1">10 Franchises.<br>One <span class="accent">Dream.</span></div>
    <div class="subline">अपनी team चुनिए</div>
  </div>

  <div class="rim-glow"></div>
  <div class="phone-wrap"><div class="phone"><div class="inner"><div class="screen">
    <div class="notch"></div><img src="assets/app-teams.jpg"><div class="glare"></div>
  </div></div></div></div>

  <div class="chip c1"><div class="chip-top">Franchises</div><div class="chip-big">10</div><div class="chip-sub">400+ players auctioned</div></div>
  <div class="chip pill c2"><span class="dot" style="background:#7C5CFF"></span><span class="lbl">Pick your team</span></div>

  <div class="floor"></div>
  <div class="ganguly"><img src="assets/ganguly-hand-point-trim.png"></div>
</div></body></html>
