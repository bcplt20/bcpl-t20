<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .headline { top: 240px; left: 90px; right: 90px; text-align: center; }
  .h1 { font-size: 146px; }
  .subline { font-size: 48px; }

  .phone-wrap { width: 650px; top: 880px; left: 45px; transform: perspective(2400px) rotateY(11deg) rotate(-2deg); }
  .phone { width: 650px; }
  .phone .inner { height: 1340px; }
  .rim-glow { width: 770px; height: 1380px; top: 900px; left: 0px;
    background: radial-gradient(circle, rgba(0,220,245,0.7), rgba(124,92,255,0.35), transparent 70%); }

  .ganguly { width: 540px; bottom: 0; right: 40px; }
  .floor { width: 420px; bottom: 30px; right: 60px; }

  .stroke.a { width: 1500px; height: 150px; top: 700px; left: -160px; transform: rotate(-15deg); }
  .stroke.b { width: 1200px; height: 120px; top: 2270px; left: -180px; transform: rotate(-15deg); opacity:0.78; }
  .stroke.c { width: 900px; height: 110px; top: 660px; left: 520px; transform: rotate(-15deg); opacity:0.7; }

  .ball { width: 230px; height: 230px; top: 760px; left: 120px; transform: rotate(14deg); }
  .ball-trail { width: 360px; height: 360px; top: 700px; left: 60px; }

  .chip.c1 { top: 2280px; left: 70px; }
  .chip.pill.c2 { top: 2560px; left: 70px; }
</style></head>
<body><div class="stage">
  <div class="bg-base"></div><div class="mesh"></div>
  <div class="strokes">
    <div class="stroke s-cyan a"></div>
    <div class="stroke s-magenta b"></div>
    <div class="stroke s-green c"></div>
  </div>
  <div class="ball-trail"></div><div class="ball"></div>
  <div class="vignette"></div><div class="grain"></div>

  <div class="logo"><img src="assets/bcpl-logo-white.png"></div>

  <div class="headline">
    <div class="eyebrow">Follow The Action</div>
    <div class="h1">Live Matches<br>&amp; <span class="accent">Scores</span></div>
    <div class="subline">हर match, हर score — एक जगह</div>
  </div>

  <div class="rim-glow"></div>
  <div class="phone-wrap"><div class="phone"><div class="inner"><div class="screen">
    <div class="notch"></div><img src="assets/app-matches.jpg"><div class="glare"></div>
  </div></div></div></div>

  <div class="chip c1"><div class="chip-top">Now Playing</div><div class="chip-big">CHE v MUM</div><div class="chip-sub">Group A &middot; 2:00 PM</div></div>
  <div class="chip pill c2"><span class="dot" style="background:#FF3DA6"></span><span class="lbl">Live &middot; Upcoming &middot; Results</span></div>

  <div class="floor"></div>
  <div class="ganguly"><img src="assets/ganguly-hand-point-trim.png"></div>
</div></body></html>
