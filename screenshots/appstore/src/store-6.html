<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .headline { top: 240px; left: 80px; right: 80px; text-align: center; }
  .h1 { font-size: 138px; }
  .subline { font-size: 44px; }

  .phone-wrap { width: 640px; top: 890px; left: 45px; transform: perspective(2400px) rotateY(11deg) rotate(-2deg); }
  .phone { width: 640px; }
  .phone .inner { height: 1320px; }
  .rim-glow { width: 760px; height: 1360px; top: 910px; left: 0px;
    background: radial-gradient(circle, rgba(124,92,255,0.65), rgba(255,61,166,0.35), transparent 70%); }

  .ganguly { width: 540px; bottom: 0; right: 40px; }
  .floor { width: 420px; bottom: 30px; right: 60px; }

  .stroke.a { width: 1500px; height: 150px; top: 710px; left: -150px; transform: rotate(-16deg); }
  .stroke.b { width: 1200px; height: 120px; top: 2270px; left: -180px; transform: rotate(-16deg); opacity:0.78; }
  .stroke.c { width: 900px; height: 110px; top: 660px; left: 520px; transform: rotate(-16deg); opacity:0.7; }

  .ball { width: 220px; height: 220px; top: 760px; left: 120px; transform: rotate(14deg); }
  .ball-trail { width: 350px; height: 350px; top: 700px; left: 60px; }

  .chip.c1 { top: 2280px; left: 70px; }
  .chip.pill.c2 { top: 2560px; left: 70px; }
</style></head>
<body><div class="stage">
  <div class="bg-base"></div><div class="mesh"></div>
  <div class="strokes">
    <div class="stroke s-violet a"></div>
    <div class="stroke s-magenta b"></div>
    <div class="stroke s-cyan c"></div>
  </div>
  <div class="ball-trail"></div><div class="ball"></div>
  <div class="vignette"></div><div class="grain"></div>

  <div class="logo"><img src="assets/bcpl-logo-white.png"></div>

  <div class="headline">
    <div class="eyebrow">Phase 2 &middot; Physical Trial</div>
    <div class="h1">Your Trial<br><span class="accent">Pass</span></div>
    <div class="subline">QR गेट पर दिखाएँ — venue, batch और reporting time साथ</div>
  </div>

  <div class="rim-glow"></div>
  <div class="phone-wrap"><div class="phone"><div class="inner"><div class="screen">
    <div class="notch"></div><img src="assets/app-trialpass.jpg"><div class="glare"></div>
  </div></div></div></div>

  <div class="chip c1"><div class="chip-top">Venue Gate</div><div class="chip-big">Scan &amp; enter</div><div class="chip-sub">Arun Jaitley Stadium &middot; Delhi</div></div>
  <div class="chip pill c2"><span class="dot" style="background:#C36BFF"></span><span class="lbl">Batch A &middot; 07:00 AM</span></div>

  <div class="floor"></div>
  <div class="ganguly"><img src="assets/ganguly-hand-point-trim.png"></div>
</div></body></html>
